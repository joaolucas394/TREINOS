<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>IronFit • Painel do Aluno</title>

<style>
/* =========================================================
   1. VARIÁVEIS DE TEMA
   Para laranja neon, use --accent:#ff6a1a e --accent-rgb:255,106,26
   ========================================================= */
:root{
  --bg:#0a0b0d;
  --surface:#13151a;
  --surface-2:#1b1e25;
  --line:#272b34;
  --text:#f1f3f6;
  --muted:#8b93a1;
  --accent:#39ff88;              /* verde neon */
  --accent-rgb:57,255,136;
  --danger:#ff5468;
  --radius:18px;
}

/* =========================================================
   2. RESET E BASE (mobile-first)
   ========================================================= */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-tap-highlight-color:transparent; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(520px 280px at 100% -5%, rgba(var(--accent-rgb),.12), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.4;
  min-height:100vh;
}
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
ul,ol{ list-style:none; }

/* Container central; reserva espaço para a barra de abas fixa */
.app{
  max-width:560px; margin-inline:auto;
  padding:max(1rem, env(safe-area-inset-top)) 1rem calc(6rem + env(safe-area-inset-bottom));
}

/* =========================================================
   3. COMPONENTES BASE
   ========================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:1.1rem;
}
.rotulo{
  font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.btn{
  width:100%; padding:.95rem 1rem; border-radius:14px; font-weight:700;
  background:var(--accent); color:#06120b;
  box-shadow:0 0 22px -6px var(--accent);
  transition:transform .1s, opacity .2s;
}
.btn:active{ transform:scale(.98); }
.btn:disabled{ background:var(--surface-2); color:var(--muted); box-shadow:none; cursor:default; }
.btn.sec{ background:transparent; color:var(--accent); border:1px solid var(--accent); box-shadow:none; }

/* =========================================================
   4. CABEÇALHO
   ========================================================= */
.topo{ display:flex; align-items:center; gap:.9rem; margin-bottom:1rem; }
.avatar{
  width:52px; height:52px; border-radius:50%; flex-shrink:0; overflow:hidden;
  border:2px solid var(--accent); box-shadow:0 0 16px -2px var(--accent);
}
.avatar svg{ width:100%; height:100%; display:block; }
.topo small{ color:var(--muted); font-size:.8rem; }
.topo h1{ font-size:1.3rem; line-height:1.15; }
.pill{
  margin-left:auto; font-size:.72rem; font-weight:700; padding:.35rem .65rem;
  border-radius:999px; border:1px solid currentColor; white-space:nowrap;
}
.pill.ok{ color:var(--accent); }
.pill.vencido{ color:var(--danger); }

/* =========================================================
   5. ABAS (barra de navegação inferior fixa)
   ========================================================= */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  background:rgba(10,11,13,.92); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar ul{ max-width:560px; margin-inline:auto; display:grid; grid-template-columns:repeat(3,1fr); }
.tab{
  width:100%; padding:.7rem 0 .6rem; display:flex; flex-direction:column;
  align-items:center; gap:.2rem; font-size:.72rem; color:var(--muted); transition:color .2s;
}
.tab svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.tab[aria-selected="true"]{ color:var(--accent); }
.tab:focus-visible{ outline:2px solid var(--accent); outline-offset:-4px; border-radius:12px; }

/* Seções: só a ativa aparece */
.secao{ display:none; }
.secao.ativa{ display:grid; gap:1rem; animation:entra .25s ease; }
@keyframes entra{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* =========================================================
   6. TREINO DIÁRIO
   ========================================================= */
.chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
.chip{
  padding:.7rem 0; border-radius:12px; font-weight:600; font-size:.9rem;
  border:1px solid var(--line); color:var(--muted); transition:.2s;
}
.chip[aria-pressed="true"]{
  background:var(--accent); border-color:var(--accent); color:#06120b;
  box-shadow:0 0 18px -4px var(--accent);
}

/* Progresso */
.prog-topo{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:.7rem; }
.prog-topo h2{ font-size:1.15rem; }
.prog-topo strong{ font-size:1.8rem; color:var(--accent); line-height:1; }
.barra{ height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.barra i{
  display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg, var(--accent), #b6ffd4);
  box-shadow:0 0 12px var(--accent); transition:width .45s ease;
}
.prog-msg{ margin-top:.6rem; font-size:.82rem; color:var(--muted); min-height:1.2em; }

/* Lista de exercícios (checkbox real escondido + caixa visual) */
.exercicios{ display:grid; gap:.6rem; }
.ex{
  position:relative; display:flex; align-items:center; gap:.85rem;
  padding:.85rem; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; transition:.2s;
}
.ex input{ position:absolute; opacity:0; }
.box{
  position:relative; width:28px; height:28px; flex-shrink:0;
  border:2px solid var(--line); border-radius:9px; transition:.2s;
}
.box::after{
  content:""; position:absolute; left:8px; top:3px; width:7px; height:13px;
  border:solid #06120b; border-width:0 3px 3px 0;
  transform:rotate(45deg) scale(0); transition:.15s;
}
.ex input:checked ~ .box{ background:var(--accent); border-color:var(--accent); }
.ex input:checked ~ .box::after{ transform:rotate(45deg) scale(1); }
.ex input:focus-visible ~ .box{ outline:2px solid #fff; outline-offset:2px; }
.ex:has(input:checked){ border-color:rgba(var(--accent-rgb),.4); }
.ex input:checked ~ .info{ opacity:.5; }
.ex input:checked ~ .info strong{ text-decoration:line-through; }
.info strong{ display:block; }
.meta{ display:block; margin-top:.2rem; font-size:.82rem; color:var(--muted); }
.meta b{ color:var(--accent); }

/* =========================================================
   7. FREQUÊNCIA
   ========================================================= */
.freq-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.freq-topo h2{ font-size:1.1rem; text-transform:capitalize; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
.stat strong{ display:block; font-size:2rem; color:var(--accent); line-height:1.1; }
.cal-semana,.cal-dias{ display:grid; grid-template-columns:repeat(7,1fr); gap:.35rem; }
.cal-semana{ text-align:center; font-size:.7rem; color:var(--muted); margin-bottom:.4rem; }
.dia{
  aspect-ratio:1; border-radius:10px; font-size:.85rem;
  background:var(--surface-2); border:1px solid var(--line);
}
.dia.vazio{ background:none; border:none; }
.dia.presente{ background:var(--accent); border-color:var(--accent); color:#06120b; font-weight:700; }
.dia.futuro{ opacity:.3; }
.dia.hoje{ outline:2px solid #fff; outline-offset:1px; }
.dia:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

/* =========================================================
   8. FINANCEIRO
   ========================================================= */
.fin-status{ display:flex; align-items:center; gap:.7rem; margin:.3rem 0 1rem; }
.fin-status h2{ font-size:1.9rem; }
.fin-status.ok h2{ color:var(--accent); }
.fin-status.vencido h2{ color:var(--danger); }
.ponto{ width:12px; height:12px; border-radius:50%; background:currentColor; box-shadow:0 0 12px currentColor; }
.fin-status.ok{ color:var(--accent); }
.fin-status.vencido{ color:var(--danger); }
.grade2{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.1rem; }
.grade2 strong{ display:block; font-size:1.1rem; }

.pix{ margin-top:1rem; padding-top:1rem; border-top:1px dashed var(--line); }
.pix[hidden]{ display:none; }
.qr{
  width:150px; height:150px; margin:.8rem auto; padding:8px; background:#fff; border-radius:12px;
}
.qr svg{ width:100%; height:100%; display:block; }
.codigo{
  width:100%; padding:.7rem; margin-bottom:.7rem; border-radius:10px; font-size:.72rem;
  background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
  word-break:break-all; font-family:ui-monospace,Consolas,monospace;
}
.pagamentos li{
  display:flex; justify-content:space-between; align-items:center;
  padding:.75rem 0; border-top:1px solid var(--line);
}
.pagamentos p{ font-weight:600; font-size:.92rem; }
.pagamentos small{ color:var(--muted); font-size:.75rem; }
.pagamentos .v{ text-align:right; }
.pagamentos .v span{ display:block; color:var(--accent); font-size:.75rem; }

/* Aviso rápido (toast) */
.toast{
  position:fixed; left:50%; bottom:calc(5.5rem + env(safe-area-inset-bottom));
  transform:translate(-50%,20px); opacity:0; pointer-events:none; z-index:20;
  background:var(--text); color:#0a0b0d; font-weight:600; font-size:.85rem;
  padding:.7rem 1.1rem; border-radius:99px; transition:.3s; max-width:90vw; text-align:center;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* =========================================================
   9. TELAS MAIORES
   ========================================================= */
@media (min-width:640px){
  .app{ max-width:680px; padding-top:2rem; }
  .exercicios{ grid-template-columns:1fr 1fr; }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

<body>
<div class="app">

  <!-- ================= CABEÇALHO ================= -->
  <header class="topo">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" fill="#1b1e25"/>
        <circle cx="50" cy="38" r="18" fill="#39ff88"/>
        <path d="M14 100c2-26 18-38 36-38s34 12 36 38z" fill="#39ff88"/>
      </svg>
    </div>
    <div>
      <small>Bem-vindo de volta</small>
      <h1 id="aluno-nome">Carlos Silva</h1>
    </div>
    <span id="pill-status" class="pill ok">Em dia</span>
  </header>

  <main>

    <!-- ================= TREINO DIÁRIO ================= -->
    <section id="sec-treino" class="secao ativa" role="tabpanel" aria-labelledby="tab-treino">
      <div class="chips" id="chips" role="group" aria-label="Escolher treino"></div>

      <div class="card">
        <div class="prog-topo">
          <div>
            <span class="rotulo">Foco de hoje</span>
            <h2 id="treino-titulo"></h2>
          </div>
          <strong id="treino-pct">0%</strong>
        </div>
        <div class="barra" role="progressbar" aria-label="Progresso do treino"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barra-wrap">
          <i id="barra"></i>
        </div>
        <p class="prog-msg" id="treino-msg"></p>
      </div>

      <ul class="exercicios" id="lista-ex"></ul>
      <button class="btn sec" id="btn-reset" type="button">Reiniciar este treino</button>
    </section>

    <!-- ================= FREQUÊNCIA ================= -->
    <section id="sec-freq" class="secao" role="tabpanel" aria-labelledby="tab-freq">
      <div class="stats">
        <div class="card stat"><span class="rotulo">Treinos no mês</span><strong id="f-total">0</strong></div>
        <div class="card stat"><span class="rotulo">Esta semana</span><strong id="f-semana">0</strong></div>
      </div>

      <button class="btn" id="btn-presenca" type="button">Marcar presença de hoje</button>

      <div class="card">
        <div class="freq-topo">
          <h2 id="f-mes"></h2>
          <span class="rotulo">Toque para editar</span>
        </div>
        <ol class="cal-semana" aria-hidden="true">
          <li>D</li><li>S</li><li>T</li><li>Q</li><li>Q</li><li>S</li><li>S</li>
        </ol>
        <div class="cal-dias" id="cal"></div>
      </div>
    </section>

    <!-- ================= FINANCEIRO ================= -->
    <section id="sec-fin" class="secao" role="tabpanel" aria-labelledby="tab-fin">
      <div class="card">
        <span class="rotulo">Mensalidade</span>
        <div class="fin-status ok" id="fin-status">
          <span class="ponto"></span><h2 id="fin-texto">Em dia</h2>
        </div>
        <div class="grade2">
          <div><span class="rotulo">Vencimento</span><strong id="fin-venc"></strong></div>
          <div><span class="rotulo">Valor</span><strong id="fin-valor"></strong></div>
        </div>
        <button class="btn" id="btn-pix" type="button">Pagar via Pix</button>

        <!-- Área do Pix (simulada) -->
        <div class="pix" id="pix" hidden>
          <span class="rotulo">Pix copia e cola (simulação)</span>
          <div class="qr" aria-hidden="true">
            <svg viewBox="0 0 21 21" id="qr-svg" shape-rendering="crispEdges"></svg>
          </div>
          <div class="codigo" id="pix-codigo"></div>
          <button class="btn sec" id="btn-copiar" type="button" style="margin-bottom:.6rem">Copiar código</button>
          <button class="btn" id="btn-confirmar" type="button">Já paguei (simular confirmação)</button>
        </div>
      </div>

      <div class="card">
        <span class="rotulo">Histórico de pagamentos</span>
        <ul class="pagamentos" id="hist" style="margin-top:.6rem"></ul>
      </div>
    </section>
  </main>
</div>

<!-- ================= BARRA DE ABAS ================= -->
<nav class="tabbar" aria-label="Navegação principal">
  <ul role="tablist">
    <li><button class="tab" role="tab" id="tab-treino" data-alvo="sec-treino" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Treino</button></li>
    <li><button class="tab" role="tab" id="tab-freq" data-alvo="sec-freq" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Frequência</button></li>
    <li><button class="tab" role="tab" id="tab-fin" data-alvo="sec-fin" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Financeiro</button></li>
  </ul>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   DADOS (em produção, viriam de uma API)
========================================================= */
const TREINOS = {
  A: { nome:'Peito & Tríceps', ex:[
    ['Supino reto',4,10,'60 kg'], ['Supino inclinado',3,12,'24 kg'],
    ['Crucifixo na máquina',3,12,'40 kg'], ['Tríceps na corda',4,12,'25 kg'], ['Tríceps testa',3,10,'20 kg'] ]},
  B: { nome:'Costas & Bíceps', ex:[
    ['Puxada frontal',4,10,'55 kg'], ['Remada curvada',4,10,'50 kg'],
    ['Remada baixa',3,12,'45 kg'], ['Rosca direta',4,10,'30 kg'], ['Rosca martelo',3,12,'14 kg'] ]},
  C: { nome:'Pernas & Ombros', ex:[
    ['Agachamento livre',4,8,'80 kg'], ['Leg press 45°',4,12,'160 kg'],
    ['Cadeira extensora',3,15,'50 kg'], ['Desenvolvimento',4,10,'20 kg'], ['Elevação lateral',3,15,'8 kg'] ]}
};

const VALOR = 129.90;
const DIA_VENC = 10;               // vence todo dia 10
const HISTORICO_BASE = [
  { mes:'Setembro/2026', data:'09/09', metodo:'Cartão' },
  { mes:'Agosto/2026',   data:'10/08', metodo:'Pix' },
  { mes:'Julho/2026',    data:'10/07', metodo:'Boleto' }
];

/* =========================================================
   UTILITÁRIOS E ESTADO (salvo no localStorage, com try/catch)
========================================================= */
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad = n => String(n).padStart(2,'0');

const KEY = 'ironfit-v1';
let state = { done:{}, freq:{}, pago:null };   // pago: mês pago (ex.: "2026-11") ou null
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){}
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

let toastTimer;
function aviso(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const hoje = new Date();
const ano = hoje.getFullYear(), mes = hoje.getMonth(), diaHoje = hoje.getDate();
const mesKey = `${ano}-${pad(mes+1)}`;

/* =========================================================
   1. SISTEMA DE ABAS
========================================================= */
const abas = [...document.querySelectorAll('.tab')];
function abrirAba(btn){
  abas.forEach(b => b.setAttribute('aria-selected', b === btn));
  document.querySelectorAll('.secao').forEach(s => s.classList.toggle('ativa', s.id === btn.dataset.alvo));
  window.scrollTo({ top:0, behavior:'smooth' });
}
abas.forEach((b,i) => {
  b.addEventListener('click', () => abrirAba(b));
  // Setas do teclado navegam entre as abas
  b.addEventListener('keydown', e => {
    if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
      const prox = abas[(i + (e.key==='ArrowRight'?1:-1) + abas.length) % abas.length];
      prox.focus(); abrirAba(prox);
    }
  });
});

/* =========================================================
   2. TREINO DIÁRIO + BARRA DE PROGRESSO
========================================================= */
// Sugere o treino pelo dia da semana: seg/qui=A, ter/sex=B, qua/sáb=C
const sugerido = ({1:'A',2:'B',3:'C',4:'A',5:'B',6:'C'})[hoje.getDay()] || 'A';
let treinoAtual = sugerido;

function renderTreino(){
  const t = TREINOS[treinoAtual];

  // Botões A / B / C
  $('chips').innerHTML = Object.keys(TREINOS).map(k =>
    `<button class="chip" type="button" data-t="${k}" aria-pressed="${k===treinoAtual}">Treino ${k}</button>`).join('');

  $('treino-titulo').textContent = t.nome;

  // Exercícios com checkbox real (acessível) + caixa visual
  $('lista-ex').innerHTML = t.ex.map(([nome,series,reps,carga], i) => `
    <li><label class="ex">
      <input type="checkbox" data-i="${i}" ${state.done[treinoAtual+'-'+i] ? 'checked':''}>
      <span class="box"></span>
      <span class="info"><strong>${nome}</strong>
        <span class="meta"><b>${series}</b> séries · <b>${reps}</b> reps · <b>${carga}</b></span></span>
    </label></li>`).join('');

  atualizarProgresso();
}

function atualizarProgresso(){
  const t = TREINOS[treinoAtual];
  const feitos = t.ex.filter((_,i) => state.done[treinoAtual+'-'+i]).length;
  const pct = Math.round(feitos / t.ex.length * 100);

  $('barra').style.width = pct + '%';
  $('treino-pct').textContent = pct + '%';
  $('barra-wrap').setAttribute('aria-valuenow', pct);
  $('treino-msg').textContent =
    pct === 100 ? '🔥 Treino completo! Não esqueça de marcar sua presença.' :
    feitos === 0 ? 'Marque os exercícios conforme for concluindo.' :
    `${feitos} de ${t.ex.length} exercícios concluídos.`;
}

// Troca de treino (delegação de evento)
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if(!b) return;
  treinoAtual = b.dataset.t; renderTreino();
});
// Marcar / desmarcar exercício
$('lista-ex').addEventListener('change', e => {
  if(!e.target.matches('input[type=checkbox]')) return;
  state.done[treinoAtual+'-'+e.target.dataset.i] = e.target.checked;
  salvar(); atualizarProgresso();
  if(e.target.checked && $('treino-pct').textContent==='100%') aviso('Treino concluído! 💪');
});
// Reiniciar o treino atual
$('btn-reset').addEventListener('click', () => {
  TREINOS[treinoAtual].ex.forEach((_,i) => delete state.done[treinoAtual+'-'+i]);
  salvar(); renderTreino(); aviso('Treino reiniciado');
});

/* =========================================================
   3. FREQUÊNCIA (calendário do mês atual)
========================================================= */
const presentes = () => state.freq[mesKey] || (state.freq[mesKey] = []);

function renderFreq(){
  const lista = presentes();
  const primeiro = new Date(ano, mes, 1).getDay();
  const total = new Date(ano, mes+1, 0).getDate();

  $('f-mes').textContent = hoje.toLocaleDateString('pt-BR',{ month:'long', year:'numeric' });

  let html = '<span class="dia vazio"></span>'.repeat(primeiro);
  for(let d=1; d<=total; d++){
    const cls = ['dia'];
    if(lista.includes(d)) cls.push('presente');
    if(d > diaHoje) cls.push('futuro');
    if(d === diaHoje) cls.push('hoje');
    html += `<button class="${cls.join(' ')}" type="button" data-d="${d}"
      aria-pressed="${lista.includes(d)}" aria-label="Dia ${d}" ${d>diaHoje?'disabled':''}>${d}</button>`;
  }
  $('cal').innerHTML = html;

  // Treinos nesta semana (domingo a sábado)
  const inicioSemana = diaHoje - hoje.getDay();
  const semana = lista.filter(d => d >= inicioSemana && d <= diaHoje).length;

  $('f-total').textContent = lista.length;
  $('f-semana').textContent = semana;

  const jaMarcou = lista.includes(diaHoje);
  $('btn-presenca').disabled = jaMarcou;
  $('btn-presenca').textContent = jaMarcou ? '✓ Presença de hoje registrada' : 'Marcar presença de hoje';
}

$('btn-presenca').addEventListener('click', () => {
  const l = presentes();
  if(!l.includes(diaHoje)) l.push(diaHoje);
  salvar(); renderFreq(); aviso('Presença registrada! 🔥');
});
// Tocar num dia passado alterna presença (útil para corrigir esquecimentos)
$('cal').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if(!b) return;
  const d = +b.dataset.d, l = presentes(), i = l.indexOf(d);
  i >= 0 ? l.splice(i,1) : l.push(d);
  salvar(); renderFreq();
});

/* =========================================================
   4. FINANCEIRO + PIX SIMULADO
   Regra: se o mês atual não foi pago e o dia 10 já passou → Vencido.
========================================================= */
function situacao(){
  const pagoEsteMes = state.pago === mesKey;
  if(pagoEsteMes) return { vencido:false, venc:new Date(ano, mes+1, DIA_VENC) };   // próximo vencimento
  const venc = new Date(ano, mes, DIA_VENC);
  const vencido = diaHoje > DIA_VENC;
  return { vencido, venc: vencido ? venc : venc };
}

function renderFin(){
  const s = situacao();
  const pago = state.pago === mesKey;

  // Estado visual
  $('fin-status').className = 'fin-status ' + (s.vencido ? 'vencido' : 'ok');
  $('fin-texto').textContent = s.vencido ? 'Vencido' : 'Em dia';
  $('pill-status').className = 'pill ' + (s.vencido ? 'vencido' : 'ok');
  $('pill-status').textContent = s.vencido
    ? 'Vencido' : `Em dia · vence ${pad(s.venc.getDate())}/${pad(s.venc.getMonth()+1)}`;

  $('fin-venc').textContent = s.venc.toLocaleDateString('pt-BR');
  $('fin-valor').textContent = brl(VALOR);

  // Botão Pix: some quando o mês já está pago
  $('btn-pix').disabled = pago;
  $('btn-pix').textContent = pago ? '✓ Mensalidade paga' : 'Pagar via Pix';
  if(pago) $('pix').hidden = true;

  // Histórico (inclui o pagamento feito agora, se houver)
  const hist = [...HISTORICO_BASE];
  if(pago) hist.unshift({ mes:`${hoje.toLocaleDateString('pt-BR',{month:'long'}).replace(/^./,c=>c.toUpperCase())}/${ano}`,
                          data:'hoje', metodo:'Pix' });
  $('hist').innerHTML = hist.map(p => `
    <li><div><p>${p.mes}</p><small>Pago em ${p.data} · ${p.metodo}</small></div>
    <div class="v"><p>${brl(VALOR)}</p><span>✓ Pago</span></div></li>`).join('');
}

// QR Code decorativo (padrão pseudoaleatório, NÃO é um QR real)
function desenharQR(){
  let seed = 7, svg = '';
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/>
    <rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/>
    <rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0; y<21; y++) for(let x=0; x<21; x++){
    const canto = (x<8&&y<8) || (x>12&&y<8) || (x<8&&y>12);
    if(!canto && rnd() > .52) svg += `<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;
  }
  $('qr-svg').innerHTML = svg + finder(0,0) + finder(14,0) + finder(0,14);
}

const CODIGO_PIX = '00020126580014br.gov.bcb.pix0136demo-ironfit-0000-0000-0000520400005303986540' +
                   '5129.905802BR5909IRONFIT6009SAO PAULO62070503***6304ABCD';

$('btn-pix').addEventListener('click', () => {
  $('pix').hidden = !$('pix').hidden;
  if(!$('pix').hidden){
    desenharQR(); $('pix-codigo').textContent = CODIGO_PIX;
    $('pix').scrollIntoView({ behavior:'smooth', block:'center' });
  }
});
$('btn-copiar').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(CODIGO_PIX); aviso('Código copiado!'); }
  catch(e){ aviso('Não foi possível copiar automaticamente'); }
});
$('btn-confirmar').addEventListener('click', () => {
  state.pago = mesKey; salvar(); renderFin(); aviso('Pagamento confirmado! ✅');
});

/* =========================================================

========================================================= */
renderTreino(); renderFreq(); renderFin();
